  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: project-me-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - project-me-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2
    container_name: project-me-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - project-me-network

networks:
  project-me-network:
    driver: bridge

volumes:
  project-me-data:
    driver: local
  elasticsearch_data:
    driver: local